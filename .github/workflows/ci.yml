name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.cmd line endings
        run: python3 scripts/check-install-cmd.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: go vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: terminal output flow control race tests
        run: go test -race ./internal/ui -run 'TestTerminalOutput(Window|Backpressure|ExitDrains)$' -count=1
      - name: reuse and monitoring race tests
        run: go test -race ./internal/cli ./internal/metrics -run 'Test(DaemonIPC|DaemonReusesConnectionAndRechecksPolicy|ParallelBoundAndPartialSnapshot)$' -count=1
      - name: UI behavior regressions
        run: node --test scripts/ui.test.cjs
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  windows-ui:
    name: native Windows paths and UI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: native folder and Unicode path tests
        shell: bash
        run: go test ./internal/ui -run 'Test(CleanPickedDir|RevealTarget|RevealDownloadAPI|PickDownloadDirAPI|WindowsPickerUTF8|WorkspaceChrome|ExecFailureStatus|OperationDedupAndIsolation|InterruptedOperationIsUnknownAndNotReplayed|TerminalDialFailureWritesReason|TerminalTabAliasIsNotNestedButton|OperationResultBudgetRetainsReplayProtection|CanceledOperationCannotReplayCompletedLookingPayload|AuditFailureDoesNotChangeRemoteResult|AuditFailureSurvivesStreamingAndPoolClose|TerminalOutputWindow|TerminalOutputBackpressure|TerminalOutputExitDrains|TransferFailureRequiresVerification)$' -count=1
      - name: UI behavior and UTF-8 regressions
        run: node --test scripts/ui.test.cjs
      - name: safety completion regressions
        shell: bash
        run: go test ./internal/cli ./internal/ui ./internal/audit ./internal/transfer ./internal/metrics ./internal/guard ./internal/sshclient -run 'Test(Integrity.*|ShortPasswordRedaction|UploadReaderPreservesOriginal|DownloadCancelPreservesOriginal|RelayFailureAndSymlinkPreserveOriginal|Elevation.*|DaemonIPC|DaemonReusesConnectionAndRechecksPolicy|ParallelBoundAndPartialSnapshot|AgentAuthenticationWithoutPrivateKeyFile|SessionExpiredRejectedBeforeDispatch|AuditPreflightStopsDispatch|TransferAdmissionAndMalformedControls)$' -count=1

  integration:
    name: openssh integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: integration test
        run: SSH_CLI_INTEGRATION=1 go test ./internal/integration -count=1 -timeout 20m

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /tmp/ssh-cli ./cmd/ssh-cli

  package:
    name: package archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: pack release archives
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=dev
          fi
          bash scripts/package.sh "$ver" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" dist
      - uses: actions/upload-artifact@v4
        with:
          name: ssh-cli-dist
          path: dist/
